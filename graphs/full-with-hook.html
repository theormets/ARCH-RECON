  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

quot;:54.07,&quot;p&quot;:&quot;Late Period (664–332 BC)&quot;,&quot;m&quot;:&quot;Bronze (paper reports a Cu–Sn–Pb ternary alloy); iron clapper&quot;,&quot;site&quot;:&quot;Kom Oshim / Fayoum&quot;,&quot;src&quot;:&quot;Characterization and Conservation Study of Ancient Egyptian Bronze Bells&quot;,&quot;u&quot;:&quot;https://ejars.sohag-univ.edu.eg/Articles/Details/173&quot;},{&quot;s&quot;:72,&quot;id&quot;:&quot;AI20-21-PRK-FIG39-8&quot;,&quot;n&quot;:&quot;Bell with a four-sided hollow body&quot;,&quot;x&quot;:10.37,&quot;y&quot;:15.19,&quot;b&quot;:29.12,&quot;p&quot;:&quot;Early level of Period III&quot;,&quot;m&quot;:&quot;Leaded bronze&quot;,&quot;site&quot;:&quot;Prakash Chalcolithic site&quot;,&quot;src&quot;:&quot;Prakash 1955: A Chalcolithic Site — Ancient India Nos. 20 &amp; 21&quot;,&quot;u&quot;:&quot;https://ignca.gov.in/Asi_data/45770.pdf&quot;},{&quot;s&quot;:73,&quot;id&quot;:&quot;AI20-21-PRK-FIG39-9&quot;,&quot;n&quot;:&quot;Bell with a cup-shaped hollow body&quot;,&quot;x&quot;:32.08,&quot;y&quot;:26.97,&quot;b&quot;:47.88,&quot;p&quot;:&quot;Mid-level of Period III&quot;,&quot;m&quot;:&quot;Bronze&quot;,&quot;site&quot;:&quot;Prakash Chalcolithic site&quot;,&quot;src&quot;:&quot;Prakash 1955: A Chalcolithic Site — Ancient India Nos. 20 &amp; 21&quot;,&quot;u&quot;:&quot;https://ignca.gov.in/Asi_data/45770.pdf&quot;}];

  const hookReference = { x: 6.45, y: 8.16, label: &quot;Measured hook reference&quot;, isReference: true };

  const eraFor = d =&gt; {
    const p = d.p.toLowerCase();
    if (p.includes(&quot;period iii&quot;)) return &quot;Chalcolithic / Period III&quot;;
    if (p.includes(&quot;20th century&quot;)) return &quot;Modern / reproduction&quot;;
    const hasBC = /\b(bce|bc)\b/.test(p);
    const hasCE = /\b(ce|ad)\b/.test(p);
    if (hasBC &amp;&amp; hasCE) return &quot;BCE–CE transition&quot;;
    if (hasBC || p.includes(&quot;millennium bce&quot;)) return &quot;Ancient BCE&quot;;
    if (/^(ca\.\s*)?\d{4}$/.test(p) || /(?:5th|6th|7th|8th|9th|10th|11th|12th|13th|14th|15th)[–-]?(?:\d+\w*)?\s+century/.test(p) || p.includes(&quot;1300s&quot;) || p.includes(&quot;750–950 ce&quot;)) return &quot;Medieval&quot;;
    if (hasCE || p.includes(&quot;1st century&quot;) || p.includes(&quot;2nd century&quot;)) return &quot;Early historic CE&quot;;
    return &quot;Unclassified period&quot;;
  };
  const materialFor = d =&gt; {
    const m = d.m.toLowerCase();
    if (m.includes(&quot;bronze&quot;)) return &quot;Bronze-based&quot;;
    if (m.includes(&quot;brass&quot;)) return &quot;Brass&quot;;
    if (m.includes(&quot;gold&quot;)) return &quot;Gold alloy&quot;;
    if (m.includes(&quot;faience&quot;)) return &quot;Faience&quot;;
    if (m.includes(&quot;copper&quot;) || m.includes(&quot;cupreous&quot;)) return &quot;Copper alloy&quot;;
    if (m.includes(&quot;iron&quot;)) return &quot;Iron&quot;;
    if (m.includes(&quot;metal&quot;)) return &quot;Metal, unspecified&quot;;
    return &quot;Other&quot;;
  };
  const sourceFor = d =&gt; {
    if (d.src.includes(&quot;Metropolitan&quot;)) return &quot;The Met&quot;;
    if (d.src.includes(&quot;Cleveland&quot;)) return &quot;Cleveland Museum&quot;;
    if (d.src.includes(&quot;Egyptian Bronze Bells&quot;)) return &quot;EJARS research paper&quot;;
    if (d.src.includes(&quot;Prakash 1955&quot;)) return &quot;Ancient India / ASI paper&quot;;
    return d.src;
  };
  const shapeFor = d =&gt; {
    const ratio = d.y / d.x;
    return ratio &gt; 1.15 ? &quot;Tall loop&quot; : ratio &lt; 0.85 ? &quot;Wide loop&quot; : &quot;Balanced loop&quot;;
  };
  data.forEach(d =&gt; {
    d.era = eraFor(d);
    d.material = materialFor(d);
    d.source = sourceFor(d);
    d.shape = shapeFor(d);
  });

  const root = document.getElementById(&quot;bell-loop-compare&quot;);
  const chartHosts = {
    era: root.querySelector(&quot;#blc-era-chart&quot;),
    material: root.querySelector(&quot;#blc-material-chart&quot;),
    site: root.querySelector(&quot;#blc-site-chart&quot;),
    source: root.querySelector(&quot;#blc-source-chart&quot;),
  };
  const legendHosts = {
    era: root.querySelector(&quot;#blc-era-legend&quot;),
    material: root.querySelector(&quot;#blc-material-legend&quot;),
    site: root.querySelector(&quot;#blc-site-legend&quot;),
    source: root.querySelector(&quot;#blc-source-legend&quot;),
  };
  const eraFilter = root.querySelector(&quot;#blc-era&quot;);
  const materialFilter = root.querySelector(&quot;#blc-material&quot;);
  const siteFilter = root.querySelector(&quot;#blc-site&quot;);
  const status = root.querySelector(&quot;#blc-status&quot;);
  const selectedLine = root.querySelector(&quot;#blc-selected&quot;);
  const tooltip = root.querySelector(&quot;#blc-tooltip&quot;);
  const fields = [&quot;era&quot;, &quot;material&quot;, &quot;site&quot;, &quot;source&quot;];
  const series = [&quot;var(--viz-series-1)&quot;,&quot;var(--viz-series-2)&quot;,&quot;var(--viz-series-3)&quot;,&quot;var(--viz-series-4)&quot;,&quot;var(--viz-series-5)&quot;,&quot;var(--viz-series-6)&quot;];
  const hidden = Object.fromEntries(fields.map(field =&gt; [field, new Set()]));
  let selected = null;
  let resizeFrame = 0;

  const categoryOf = (d, field) =&gt; d[field];
  const allCategories = field =&gt; [...new Set(data.map(d =&gt; categoryOf(d, field)))].sort(d3.ascending);
  const addOptions = (select, values) =&gt; {
    values.forEach(value =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  };
  addOptions(eraFilter, allCategories(&quot;era&quot;));
  addOptions(materialFilter, allCategories(&quot;material&quot;));
  addOptions(siteFilter, allCategories(&quot;site&quot;));

  const baseVisible = () =&gt; data.filter(d =&gt;
    (eraFilter.value === &quot;all&quot; || d.era === eraFilter.value) &amp;&amp;
    (materialFilter.value === &quot;all&quot; || d.material === materialFilter.value) &amp;&amp;
    (siteFilter.value === &quot;all&quot; || d.site === siteFilter.value)
  );
  const visibleFor = field =&gt; baseVisible().filter(d =&gt; !hidden[field].has(categoryOf(d, field)));
  const fmt = d3.format(&quot;.2f&quot;);
  const fullX = d3.extent([...data, hookReference], d =&gt; d.x);
  const fullY = d3.extent([...data, hookReference], d =&gt; d.y);
  const padX = Math.max(5, (fullX[1] - fullX[0]) * .06);
  const padY = Math.max(5, (fullY[1] - fullY[0]) * .06);
  const xDomain = [Math.max(0, fullX[0] - padX), fullX[1] + padX];
  const yDomain = [Math.max(0, fullY[0] - padY), fullY[1] + padY];

  const colorMap = field =&gt; new Map(allCategories(field).map((category, index) =&gt; [category, series[index % series.length]]));
  const renderLegend = field =&gt; {
    const host = legendHosts[field];
    host.replaceChildren();
    const counts = d3.rollup(baseVisible(), values =&gt; values.length, d =&gt; categoryOf(d, field));
    const colors = colorMap(field);
    [...counts.keys()].sort(d3.ascending).forEach(category =&gt; {
      const button = document.createElement(&quot;button&quot;);
      button.type = &quot;button&quot;;
      button.setAttribute(&quot;aria-pressed&quot;, String(!hidden[field].has(category)));
      button.innerHTML = `&lt;span class=&quot;blc-swatch&quot; style=&quot;background:${colors.get(category)}&quot;&gt;&lt;/span&gt;&lt;span&gt;${category} (${counts.get(category)})&lt;/span&gt;`;
      button.addEventListener(&quot;click&quot;, () =&gt; {
        hidden[field].has(category) ? hidden[field].delete(category) : hidden[field].add(category);
        drawAll();
      });
      host.appendChild(button);
    });
  };

  const describe = d =&gt; `&lt;strong&gt;${String(d.s).padStart(3,&quot;0&quot;)} ${d.n}&lt;/strong&gt; · ${d.shape} · W/D ${fmt(d.x)} mm · h ${fmt(d.y)} mm · h/W-D ${fmt(d.y / d.x)} · h/B ${fmt(d.y / d.b)} · ${d.p} · ${d.m} · ${d.site}&lt;a href=&quot;${d.u}&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Source&lt;/a&gt;`;
  const showTooltip = (event, d) =&gt; {
    tooltip.innerHTML = `&lt;strong&gt;${String(d.s).padStart(3,&quot;0&quot;)} ${d.n}&lt;/strong&gt;&lt;br&gt;${d.shape} · h/W-D ${fmt(d.y / d.x)} · h/B ${fmt(d.y / d.b)}&lt;br&gt;Loop W/D ${fmt(d.x)} mm · h ${fmt(d.y)} mm&lt;br&gt;Period: ${d.p}&lt;br&gt;Material: ${d.m}&lt;br&gt;Region/site: ${d.site}&lt;br&gt;Source: ${d.src}`;
    tooltip.hidden = false;
    const bounds = root.getBoundingClientRect();
    tooltip.style.left = `${Math.max(8, Math.min(event.clientX - bounds.left + 12, bounds.width - 340))}px`;
    tooltip.style.top = `${Math.max(8, event.clientY - bounds.top - 18)}px`;
  };
  const hideTooltip = () =&gt; { tooltip.hidden = true; };

  const selectBell = d =&gt; {
    selected = d;
    selectedLine.innerHTML = describe(d);
    drawAll();
  };

  function drawPanel(field) {
    const host = chartHosts[field];
    host.replaceChildren();
    const values = visibleFor(field);
    const width = Math.max(320, Math.floor(host.getBoundingClientRect().width || 480));
    const height = width &lt; 430 ? 360 : 400;
    const margin = { top: 14, right: 20, bottom: 60, left: 68 };
    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;
    const x = d3.scaleLinear().domain(xDomain).nice().range([0, innerW]);
    const y = d3.scaleLinear().domain(yDomain).nice().range([innerH, 0]);
    const colors = colorMap(field);
    const tickCount = width &lt; 430 ? 4 : 5;
    const svg = d3.select(host).append(&quot;svg&quot;)
      .attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`)
      .attr(&quot;role&quot;, &quot;img&quot;)
      .attr(&quot;aria-label&quot;, `Bell loop width versus height, highlighted by ${field}`);
    svg.append(&quot;title&quot;).text(`Bell loop dimensions by ${field}`);
    svg.append(&quot;desc&quot;).text(&quot;Each point is a bell. The dashed diagonal marks equal loop height and width. Click a point to see its three nearest loop-dimension neighbours.&quot;);
    const g = svg.append(&quot;g&quot;).attr(&quot;transform&quot;, `translate(${margin.left},${margin.top})`);
    g.append(&quot;rect&quot;).attr(&quot;data-chart-frame&quot;, &quot;&quot;).attr(&quot;width&quot;, innerW).attr(&quot;height&quot;, innerH);
    g.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;grid&quot;).attr(&quot;transform&quot;, `translate(0,${innerH})`).call(d3.axisBottom(x).ticks(tickCount).tickSize(-innerH).tickFormat(&quot;&quot;));
    g.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;grid&quot;).call(d3.axisLeft(y).ticks(tickCount).tickSize(-innerW).tickFormat(&quot;&quot;));
    g.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;).attr(&quot;transform&quot;, `translate(0,${innerH})`).call(d3.axisBottom(x).ticks(tickCount));
    g.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;).call(d3.axisLeft(y).ticks(tickCount));
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;x&quot;).attr(&quot;x&quot;, innerW / 2).attr(&quot;y&quot;, innerH + 46).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;Loop outer width / diameter (mm)&quot;);
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;y&quot;).attr(&quot;transform&quot;, &quot;rotate(-90)&quot;).attr(&quot;x&quot;, -innerH / 2).attr(&quot;y&quot;, -50).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;Loop height h (mm)&quot;);

    const refLo = Math.max(x.domain()[0], y.domain()[0]);
    const refHi = Math.min(x.domain()[1], y.domain()[1]);
    g.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;ratio-reference&quot;).attr(&quot;x1&quot;, x(refLo)).attr(&quot;y1&quot;, y(refLo)).attr(&quot;x2&quot;, x(refHi)).attr(&quot;y2&quot;, y(refHi));
    const labelValue = refLo + (refHi - refLo) * .72;
    g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;reference-label&quot;).attr(&quot;x&quot;, x(labelValue) + 5).attr(&quot;y&quot;, y(labelValue) - 5).text(&quot;h = W/D&quot;);

    if (selected &amp;&amp; values.some(d =&gt; d.s === selected.s)) {
      const xSpan = x.domain()[1] - x.domain()[0];
      const ySpan = y.domain()[1] - y.domain()[0];
      const neighbours = values.filter(d =&gt; d.s !== selected.s)
        .map(d =&gt; ({ d, distance: Math.hypot((d.x - selected.x) / xSpan, (d.y - selected.y) / ySpan) }))
        .sort((a,b) =&gt; a.distance - b.distance).slice(0,3).map(value =&gt; value.d);
      g.append(&quot;g&quot;).selectAll(&quot;line&quot;).data(neighbours).join(&quot;line&quot;)
        .attr(&quot;class&quot;, &quot;similarity-link&quot;)
        .attr(&quot;x1&quot;, x(selected.x)).attr(&quot;y1&quot;, y(selected.y))
        .attr(&quot;x2&quot;, d =&gt; x(d.x)).attr(&quot;y2&quot;, d =&gt; y(d.y));
    }

    g.append(&quot;g&quot;).selectAll(&quot;circle&quot;).data(values, d =&gt; d.s).join(&quot;circle&quot;)
      .attr(&quot;class&quot;, d =&gt; `bell-node${selected &amp;&amp; selected.s === d.s ? &quot; is-selected&quot; : &quot;&quot;}`)
      .attr(&quot;cx&quot;, d =&gt; x(d.x)).attr(&quot;cy&quot;, d =&gt; y(d.y))
      .attr(&quot;r&quot;, d =&gt; selected &amp;&amp; selected.s === d.s ? 7.5 : 5.5)
      .attr(&quot;fill&quot;, d =&gt; colors.get(categoryOf(d, field)));
    g.append(&quot;path&quot;)
      .attr(&quot;class&quot;, &quot;hook-reference&quot;)
      .attr(&quot;d&quot;, d3.symbol().type(d3.symbolStar).size(450)())
      .attr(&quot;transform&quot;, `translate(${x(hookReference.x)},${y(hookReference.y)})`);
    if (selected &amp;&amp; values.some(d =&gt; d.s === selected.s)) {
      const placeLeft = x(selected.x) &gt; innerW * .72;
      g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;reference-label&quot;)
        .attr(&quot;x&quot;, x(selected.x) + (placeLeft ? -9 : 9)).attr(&quot;y&quot;, y(selected.y) - 9)
        .attr(&quot;text-anchor&quot;, placeLeft ? &quot;end&quot; : &quot;start&quot;)
        .text(`#${String(selected.s).padStart(3,&quot;0&quot;)}`);
    }

    const overlay = g.append(&quot;rect&quot;)
      .attr(&quot;data-chart-hit&quot;, &quot;&quot;)
      .attr(&quot;data-chart-hover-overlay&quot;, &quot;cross-series&quot;)
      .attr(&quot;width&quot;, innerW).attr(&quot;height&quot;, innerH);
    overlay.on(&quot;pointermove&quot;, event =&gt; {
      if (!values.length) return hideTooltip();
      const [mx,my] = d3.pointer(event, g.node());
      const candidates = [...values, hookReference];
      const nearest = candidates.map(d =&gt; ({ d, dist: Math.hypot(x(d.x)-mx, y(d.y)-my) })).sort((a,b) =&gt; a.dist-b.dist)[0];
      if (nearest &amp;&amp; nearest.dist &lt;= 26 &amp;&amp; nearest.d.isReference) {
        tooltip.innerHTML = `&lt;strong&gt;Measured hook reference&lt;/strong&gt;&lt;br&gt;Loop W/D 6.45 mm · Part-1 height 8.16 mm&lt;br&gt;Separate measured sample; not one of the 73 dataset bells.`;
        tooltip.hidden = false;
        const bounds = root.getBoundingClientRect();
        tooltip.style.left = `${Math.max(8, Math.min(event.clientX - bounds.left + 12, bounds.width - 340))}px`;
        tooltip.style.top = `${Math.max(8, event.clientY - bounds.top - 18)}px`;
      } else if (nearest &amp;&amp; nearest.dist &lt;= 26) {
        showTooltip(event, nearest.d);
      } else {
        hideTooltip();
      }
    }).on(&quot;pointerleave&quot;, hideTooltip).on(&quot;click&quot;, event =&gt; {
      if (!values.length) return;
      const [mx,my] = d3.pointer(event, g.node());
      const nearest = values.map(d =&gt; ({ d, dist: Math.hypot(x(d.x)-mx, y(d.y)-my) })).sort((a,b) =&gt; a.dist-b.dist)[0];
      if (nearest &amp;&amp; nearest.dist &lt;= 26) selectBell(nearest.d);
    });
  }

  function drawAll() {
    const visible = baseVisible();
    const explicitSites = visible.filter(d =&gt; d.site !== &quot;Not stated in dataset&quot;).length;
    status.textContent = `${visible.length} of ${data.length} bells visible · ${explicitSites} have an explicit region/site in the retained source · star = measured hook reference · dashed line = equal loop height and width`;
    fields.forEach(field =&gt; renderLegend(field));
    fields.forEach(field =&gt; drawPanel(field));
  }

  [eraFilter, materialFilter, siteFilter].forEach(control =&gt; control.addEventListener(&quot;change&quot;, drawAll));
  drawAll();
  const observer = new ResizeObserver(() =&gt; {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(drawAll);
  });
  Object.values(chartHosts).forEach(host =&gt; observer.observe(host));
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
